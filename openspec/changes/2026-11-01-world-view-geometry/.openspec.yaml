name: world-view-geometry
description: >
  Phase 2 architecture for Parametrica: separate world geometry from camera and
  rendering, introduce typed geometry contracts (Curve2D, Curve3D, Surface,
  Mesh, Solid), define world/view operator spaces, decouple p5 from application
  state, and prepare the incremental path to surfaces, meshes, solids and
  fabrication exports without changing document v3.
