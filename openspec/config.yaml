schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Parametrica — a parametric geometry workbench (Vite + p5.js + lil-gui).
  Pure DOM-free math core: generators → operators → render passes,
  registered via Registries. The JSON document IS the form; the engine
  evaluates it deterministically. Everything math-side runs in Node
  (tests import the core directly).

  Tech stack: Vite, ES modules, p5.js, lil-gui, Playwright (e2e QA).
  Tests: node test/lab.smoke.mjs (unit groups 1-26) + npm run test:e2e.
  Quality gate: npm run lint (ESLint flat config).

  Conventions:
  - Spanish for user comms, English for code/docs/commits.
  - Single branch `main`, remote github.com/quicio/parametrica.
  - SPEC.md is the canonical source of truth (v0.1 spec).
  - Product roadmap: openspec/roadmap.md (living document).
  - Irreversible decisions: openspec/decisions/ (ADRs).
  - Per-point metadata (depth, depthAlpha) must survive all transforms.
  - Adaptive sampler: output ≤ samples cap, ≥ minSteps.
  - Sliders bind DIRECTLY to stage.params (no proxies).
  - e2e drags emit the full physical mouse sequence.

rules:
  proposal:
    - Include "Non-goals" section
    - Every formula must be defined without ambiguity
    - Reference existing SPEC.md sections when extending
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task must reference the test that verifies it
